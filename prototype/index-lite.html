let AC = null, MASTER=null, SFX_BUS=null, MUS_BUS=null, NOISE_BUF=null;
const AudioState = { music:.55, sfx:.9, theme:'menu' };
function audio(){
  if (AC){ if (AC.state==='suspended') AC.resume(); return AC; }
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value=-18; comp.ratio.value=6; comp.attack.value=.004; comp.release.value=.18;
  MASTER = AC.createGain(); MASTER.gain.value=.9;
  SFX_BUS = AC.createGain(); SFX_BUS.gain.value=AudioState.sfx;
  MUS_BUS = AC.createGain(); MUS_BUS.gain.value=AudioState.music*.5;
  SFX_BUS.connect(MASTER); MUS_BUS.connect(MASTER); MASTER.connect(comp); comp.connect(AC.destination);
  NOISE_BUF = AC.createBuffer(1, AC.sampleRate*1.2, AC.sampleRate);
  const d = NOISE_BUF.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  Music.start();
  return AC;
}
function panOf(x){ if (x==null) return 0; return Math.max(-1, Math.min(1,(x-(camX+VW/2))/(VW*.6)))*.7; }
function tone(o){ // {f,f2,dur,type,vol,x,delay}
  const ac=audio(); if(!ac) return;
  const t0=ac.currentTime+(o.delay||0);
  const osc=ac.createOscillator(), g=ac.createGain();
  osc.type=o.type||'sine'; osc.frequency.setValueAtTime(o.f,t0);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t0+o.dur);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(o.vol||.1,t0+.008);
  g.gain.exponentialRampToValueAtTime(.001,t0+o.dur);
  let n=osc;
  if (o.x!=null && ac.createStereoPanner){ const p=ac.createStereoPanner(); p.pan.value=panOf(o.x); osc.connect(p); n=p; }
  n.connect(g); g.connect(SFX_BUS);
  osc.start(t0); osc.stop(t0+o.dur+.05);
}
function noiz(o){ // {dur,vol,x,hp,lp,delay}
  const ac=audio(); if(!ac) return;
  const t0=ac.currentTime+(o.delay||0);
  const src=ac.createBufferSource(); src.buffer=NOISE_BUF; src.loop=true;
  const f=ac.createBiquadFilter(); f.type=o.hp?'highpass':'lowpass'; f.frequency.value=o.hp||o.lp||1200;
  const g=ac.createGain();
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(o.vol||.1,t0+.006);
  g.gain.exponentialRampToValueAtTime(.001,t0+o.dur);
  let n=src;
  if (o.x!=null && ac.createStereoPanner){ const p=ac.createStereoPanner(); p.pan.value=panOf(o.x); src.connect(p); n=p; }
  n.connect(f); f.connect(g); g.connect(SFX_BUS);
  src.start(t0); src.stop(t0+o.dur+.05);
}
const SFX = {

  cast(x){ tone({f:280,f2:880,dur:.2,type:'sawtooth',vol:.05,x:x}); tone({f:560,f2:1760,dur:.18,type:'sine',vol:.045,x:x,delay:.02}); },
  heal(x){ [523,659,784].forEach((f,i)=>tone({f,dur:.22,type:'sine',vol:.08,x:x,delay:i*.07})); },

// Музыка: 3 темы, процедурный шедулер с опережением
const Music = (()=>{
  const THEMES = {
    menu:  { bpm:74,  roots:[57,53,48,55], mode:[0,3,7,10], bass:.55, arp:.3,  drums:0 },
    battle:{ bpm:112, roots:[57,53,60,55], mode:[0,3,7,12], bass:1,   arp:.55, drums:.5 },
    boss:  { bpm:136, roots:[50,50,46,53], mode:[0,3,7,10], bass:1,   arp:.8,  drums:1, dark:1 }
  };
  const n2f = n => 440*Math.pow(2,(n-69)/12);
  let beat=0, nextT=0, timer=null;
  function mus(f,t0,dur,type,vol,lp){
    const ac=AC;
    const o=ac.createOscillator(), g=ac.createGain(), flt=ac.createBiquadFilter();
    o.type=type; o.frequency.value=f; o.detune.value=Math.random()*10-5;
    flt.type='lowpass'; flt.frequency.value=lp||900;
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol,t0+.25);
    g.gain.setValueAtTime(vol,t0+dur*.55);
    g.gain.linearRampToValueAtTime(0,t0+dur);
    o.connect(flt); flt.connect(g); g.connect(MUS_BUS);
    o.start(t0); o.stop(t0+dur+.1);
  }
  function drum(t0,f,dur,vol){
    const ac=AC, o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f*2,t0); o.frequency.exponentialRampToValueAtTime(f*.6,t0+dur);
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.connect(g); g.connect(MUS_BUS); o.start(t0); o.stop(t0+dur+.05);
  }
  function hat(t0,vol){
    const ac=AC; if(!NOISE_BUF) return;
    const src=ac.createBufferSource(); src.buffer=NOISE_BUF;
    const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=6000;
    const g=ac.createGain();
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.001,t0+.05);
    src.connect(f); f.connect(g); g.connect(MUS_BUS); src.start(t0); src.stop(t0+.08);
  }
  function schedule(){
    const ac=AC; if(!ac) return;
    const th=THEMES[AudioState.theme]||THEMES.menu;
    const spb=60/th.bpm/2; // восьмые
    while (nextT < ac.currentTime + .4){
      const t0=nextT, b=beat, root=th.roots[Math.floor(b/8)%th.roots.length];
      if (th.bass && b%2===0) mus(n2f(root-12), t0, spb*1.8, 'triangle', .10*th.bass);
      if (th.bass>.9 && b%8===6) mus(n2f(root-12+(th.dark?1:0)), t0, spb*1.2, 'triangle', .08);
      if (b%8===0) th.mode.forEach(iv=>mus(n2f(root+iv), t0, spb*7.6, 'sawtooth', .026, 700));
      if (th.arp){
        const seq=[0,7,12,15,7,12,19,12];
        mus(n2f(root+12+seq[b%8]), t0, spb*.9, 'square', .02*th.arp, 2400);
      }
      if (th.drums>0){
        if (b%4===0) drum(t0, 52, .16, .11*th.drums);
        if (th.drums>.9 && b%4===2) drum(t0, 44, .12, .09*th.drums);
        if (b%2===1) hat(t0, .028*th.drums+.012);
      }
      beat++; nextT+=spb;
    }
  }
  return {
    start(){ if (timer||!AC) return; nextT=AC.currentTime+.1; timer=setInterval(schedule,120); },
    setTheme(name){ if (AudioState.theme!==name){ AudioState.theme=name; beat=0; if(AC) nextT=Math.max(nextT,AC.currentTime+.05); } },
    setMusicVol(v){ if(MUS_BUS) MUS_BUS.gain.value=v*.5; },
    setSfxVol(v){ if(SFX_BUS) SFX_BUS.gain.value=v; }
  };
})();

const EL = { fire:{c:'#ee5133',n:'Огонь'}, air:{c:'#c2e0fa',n:'Воздух'}, earth:{c:'#8cb859',n:'Земля'}, water:{c:'#4d8cf2',n:'Вода'} };
const DOM = { fire:'air', air:'earth', earth:'water', water:'fire' };
function elMult(a,d){ return DOM[a]===d ? 1.25 : (DOM[d]===a ? 0.8 : 1); }
function dmgCalc(atk,def,k,ea,ed,crit){
  let d = atk*k*elMult(ea,ed)*100/(100+Math.max(0,def));
  if (crit) d *= 1.5;
  return Math.max(1,d);
}

let shakeT = 0, shakeMag = 0, punch = 1, freezeT = 0, slowT = 0, flashT = 0;
let bannerText = '', bannerT = 0, bannerSub = '';
let ripple = null, lowHpPulse = 0, stepT = 0;
let speedLines = []; // линии скорости в забеге
let interWaveT = 0;  // пауза между волнами на беговой дорожке
let menuMsg='', menuMsgT=0;

function initAmbient(){
  amb = [];
  for (let i=0;i<50;i++) amb.push({ x:Math.random()*VW, y:Math.random()*VH,
    spd:12+Math.random()*30, sway:20+Math.random()*34, ph:Math.random()*7,
    sz:1.5+Math.random()*3.5, col: Math.random()<.5?'#7fb2ff':'#ffb27f', a:.12+Math.random()*.25 });
}
initAmbient();
function updateAmbient(dt){
  for (const p of amb){
    p.y -= p.spd*dt; p.x += Math.sin(Date.now()/1400+p.ph)*p.sway*dt;
    if (p.y < -8){ p.y = VH+8; p.x = Math.random()*VW; }
  }
  for (const p of petals){
    p.y += p.spd*dt; p.x += Math.sin(Date.now()/1100+p.ph)*22*dt;
    if (p.y > VH+10){ p.y = -10; p.x = Math.random()*VW; }
  }
}
function drawAmbient(){
  for (const p of amb){
    ctx.globalAlpha = p.a*(0.7+0.3*Math.sin(Date.now()/700+p.ph));
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function shake(m,t){ shakeMag = Math.max(shakeMag,m); shakeT = Math.max(shakeT,t); }
function freeze(t){ freezeT = Math.max(freezeT,t); }
function slowmo(t){ slowT = Math.max(slowT,t); }

// ---------- FX ----------
function fxProjectile(from,to,color,big){
  effects.push({ t:'pr', x:from.x, y:from.y-from.r*1.6, tgt:to, fx0:to.x, fy0:to.y-to.r,
    sp: big?620:900, color, big:!!big, life:3, trail:[] });
}
function fxSlash(x,y,color){ effects.push({t:'sl',x,y,life:.22,T:.22,color,ang:Math.random()*7}); }
function fxAoe(x,y,r,color){ effects.push({t:'ring',x,y,r0:26,r1:r,life:.5,T:.5,color}); shake(5,.15); }
function fxBurst(x,y,color,big){ effects.push({t:'ring',x,y,r0:8,r1:big?90:60,life:.3,T:.3,color}); }
function fxHeal(x,y){ for(let i=0;i<10;i++) effects.push({t:'sp',x:x+Math.random()*80-40,y:y+Math.random()*26,vy:-(80+Math.random()*100),life:.8,T:.8,color:'#7dff9a'}); }
function fxBuff(u){ effects.push({t:'aura',u,life:.9,T:.9,color:'#ffd76a'}); }
function fxPoof(x,y,color){ for(let i=0;i<14;i++) effects.push({t:'p',x,y,vx:(Math.random()*2-1)*190,vy:-(40+Math.random()*200),life:.6,T:.6,color}); }
function fxDust(x,y){ effects.push({t:'p',x,y,vx:(Math.random()*2-1)*60,vy:-(10+Math.random()*50),life:.4,T:.4,color:'#6b76a0'}); }
function fxTele(x,y,r){ effects.push({t:'tele',x,y,r,life:.7,T:.7,color:'#ff4a4a'}); }

function tickFx(dt){
  for (const e of effects){
    e.life -= dt;
    if (e.t==='pr'){
      const tx=(e.tgt&&e.tgt.alive)?e.tgt.x:e.fx0, ty=(e.tgt&&e.tgt.alive)?e.tgt.y-e.tgt.r:e.fy0;
      const dx=tx-e.x, dy=ty-e.y, d=Math.hypot(dx,dy);
      if (d<16||e.life<=0){ fxBurst(tx,ty,e.color,e.big); e.life=-1; continue; }
      e.x+=dx/d*e.sp*dt; e.y+=dy/d*e.sp*dt;
      e.trail.push({x:e.x,y:e.y}); if (e.trail.length>7) e.trail.shift();
      if (Math.random()<.45) effects.push({t:'p', x:e.x, y:e.y,
        vx:(Math.random()*2-1)*30, vy:(Math.random()*2-1)*30, life:.3, T:.3, color:e.color});
    } else if (e.t==='sp'){ e.y+=e.vy*dt; }
    else if (e.t==='p'){ e.x+=e.vx*dt; e.y+=e.vy*dt; e.vy+=200*dt; }
  }
  effects = effects.filter(e=>e.life>0);
  if (shakeT>0){ shakeT-=dt; if (shakeT<=0) shakeMag=0; }
  punch += (1-punch)*Math.min(1,dt*8);
  if (bannerT>0) bannerT-=dt;
  if (ripple){ ripple.t+=dt; if (ripple.t>.5) ripple=null; }
  if (flashT>0) flashT-=dt;
  lowHpPulse += dt;
}
function drawFx(){
  for (const e of effects){
    const k = Math.max(0,e.life/e.T);
    if (e.t==='pr'){
      for (let i=0;i<e.trail.length;i++){
        const g = e.trail[i];
        ctx.globalAlpha = .06 + .05*i;
        ctx.fillStyle = e.color;
        ctx.beginPath(); ctx.arc(g.x,g.y,(e.big?13:7)*(i/e.trail.length+.3),0,7); ctx.fill();
      }
      ctx.globalAlpha=.8; ctx.fillStyle=e.color;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.big?16:9,0,7); ctx.fill();
      ctx.globalAlpha=1; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(e.x,e.y,e.big?6:3.5,0,7); ctx.fill();
    } else if (e.t==='sl'){
      ctx.globalAlpha=k; ctx.strokeStyle=e.color; ctx.lineWidth=7*k+2;
      ctx.beginPath(); ctx.arc(e.x,e.y,34+(1-k)*26,e.ang,e.ang+2.2); ctx.stroke();
    } else if (e.t==='ring'){
      const r=e.r0+(e.r1-e.r0)*(1-k);
      ctx.globalAlpha=k*.9; ctx.strokeStyle=e.color; ctx.lineWidth=6*k+2;
      ctx.beginPath(); ctx.arc(e.x,e.y,r,0,7); ctx.stroke();
      ctx.globalAlpha=k*.15; ctx.fillStyle=e.color;
      ctx.beginPath(); ctx.arc(e.x,e.y,r,0,7); ctx.fill();
    } else if (e.t==='tele'){
      // телеграф: пульсирующий круг опасности
      const kk = 1-k;
      ctx.globalAlpha=.25+.2*Math.sin(lowHpPulse*20);
      ctx.fillStyle=e.color;
      ctx.beginPath(); ctx.ellipse(e.x,e.y+50,e.r*kk+30,(e.r*kk+30)*.4,0,0,7); ctx.fill();
      ctx.globalAlpha=.8; ctx.strokeStyle=e.color; ctx.lineWidth=4;
      ctx.beginPath(); ctx.ellipse(e.x,e.y+50,e.r+30,(e.r+30)*.4,0,0,7); ctx.stroke();
    } else if (e.t==='sp'){
      ctx.globalAlpha=k; ctx.fillStyle=e.color;
      ctx.fillRect(e.x-2,e.y-6,4,12);
      ctx.beginPath(); ctx.arc(e.x,e.y-8,3.5,0,7); ctx.fill();
    } else if (e.t==='aura'){
      const u=e.u; if(!u) continue;
      ctx.globalAlpha=k*.5; ctx.strokeStyle=e.color; ctx.lineWidth=4;
      ctx.beginPath(); ctx.ellipse(u.x,u.y+u.r*.8,u.r*1.7,u.r*.5,0,0,7); ctx.stroke();
    } else if (e.t==='p'){
      ctx.globalAlpha=k; ctx.fillStyle=e.color;
      ctx.fillRect(e.x-2.5,e.y-2.5,5,5);
    } else if (e.t==='crack'){
      ctx.globalAlpha=k*.55; ctx.strokeStyle='#120b22'; ctx.lineWidth=3; ctx.lineCap='round';
      for (const sg of e.segs){
        ctx.beginPath();
        ctx.moveTo(e.x, e.y+24);
        ctx.lineTo(e.x+sg.dx*.5, e.y+24+sg.dy*.5+sg.m*.4);
        ctx.lineTo(e.x+sg.dx, e.y+24+sg.dy);
        ctx.stroke();
      }
    }
  }
  ctx.globalAlpha=1;
}
function addFloat(x,y,txt,color,big){
  floats.push({x,y,txt,color,t:0,big:!!big,vy:-130,vx:(Math.random()*40-20)});
}

// ---------- Бой: мир ----------
function mkUnit(base, x, y, team){
  return { ...base, maxhp:base.hp, hp:base.hp, alive:true, team,
    x, y, facing: team===0?1:-1, atkT:Math.random(), spd: base.spd || (base.boss?95:118),
    ab:(base.ab||[]).map(a=>({...a,rt:0})),
    spawnT:.35, windup:0, pendingT:null, lungeT:0, hitT:0, deathT:0, moving:false,
    pose:'idle', prevPose:null, poseBlend:1, followT:0, castT:0, hpShow:base.hp,
    trail:[], r: base.boss?74:40, slamT:5, dropY:0 };
}
function startBattle(i){
  levelIdx=i;
  const lvl=LEVELS[i];
  worldW = ROOM_PAD*2 + ROOM_W*lvl.waves.length;
  let active = ROSTER.filter(h=>SAVE.heroes.indexOf(h.id) !== -1);
  if (!active.length){ active = ROSTER.slice(0,4); } // страховка: сейв битый — играем стартовой четвёркой
  const boost = 1 + .1*(SAVE.teamLevel-1);
  team = active.map((h,k)=>{ const u=mkUnit(h, 200+k*165, GROUND_BOT-140, 0); u.r=40; u.artKey='hero_'+h.id;
    u.maxhp=Math.round(h.hp*boost); u.hp=u.maxhp; u.atk=Math.round(h.atk*boost); return u; });
  team.forEach((u,i)=>{ u.homeX = 200 + i*165; });
  enemies=[]; spawnQueue=[]; floats=[]; effects=[]; ripple=null;
  speedLines=[]; interWaveT=0;
  bannerT=0; shakeT=0; shakeMag=0; freezeT=0; slowT=0; flashT=0;
  waveIdx=0; battleTime=0; battleOver=null; rewards=null; autoMode=false;
  camX=0; camTX=0; phase='fight';
  beginWave();
  scene='battle';
  Music.setTheme('battle');
}
function roomX(i){ return ROOM_PAD + ROOM_W*i; }
function beginWave(){
  const lvl=LEVELS[levelIdx];
  if (waveIdx>=lvl.waves.length){ endBattle(true); return; }
  const rx = roomX(waveIdx);
  lvl.waves[waveIdx].forEach(g=>{
    for(let k=0;k<g.cnt;k++) spawnQueue.push({...g, delay:k*.55, rx});
  });
  bannerText = 'ВОЛНА '+(waveIdx+1)+' / '+lvl.waves.length;
  bannerSub = lvl.waves[waveIdx].some(g=>g.boss)? 'БОСС!' : '';
  bannerT = 1.4;
}
function spawnEnemy(tpl){
  let artKey='mob_dreamling';
  const map=[
    [/Вьюжный/i,'boss_blizzard'],
    [/Древний/i,'boss_ancient'],
    [/Пепла/i,'boss_ash'],
    [/Мрака/i,'boss_darklord'],
    [/^Кошмар/i,'boss_nightmare'],
    [/Сильфида II/i,'mob_sylph2'],[/Сильфид/i,'mob_sylph'],
    [/Келпи II/i,'mob_kelpie2'],[/Келпи/i,'mob_kelpie'],
    [/Морозный/i,'mob_golem_frost'],[/Магмовый/i,'mob_golem_magma'],[/страж/i,'mob_golem'],
    [/Сновидец I+II/i,'mob_dreamling2'],[/Сновидец/i,'mob_dreamling']];
  for (const [re,key] of map) if (re.test(tpl.n)){ artKey=key; break; }
  const u = mkUnit(tpl, camX + VW + 140 + Math.random()*240, GROUND_TOP+140+Math.random()*(GROUND_BOT-GROUND_TOP-280), 1);
  u.artKey=artKey; u.r = tpl.boss?74:38;
  if (tpl.boss){ u.dropY = -320; u.y = GROUND_BOT-200; }
  enemies.push(u);
  // портал появления: сходящиеся кольца + частицы
  effects.push({t:'ring', x:u.x, y:u.y+20, r0:120, r1:26, life:.45, T:.45, color:'#7fb2ff'});
  effects.push({t:'ring', x:u.x, y:u.y+20, r0:170, r1:40, life:.6, T:.6, color:'#c2a0ff'});
  for (let i=0;i<10;i++) effects.push({t:'sp', x:u.x+Math.random()*70-35, y:u.y+Math.random()*50-10,
    vy:-(70+Math.random()*110), life:.7, T:.7, color:'#9fd0ff'});
  if (tpl.boss) Music.setTheme('boss');
}
function endBattle(win){
  if (battleOver) return;
  Music.setTheme('menu');
  persist();
  battleOver = { win, scripted: !!LEVELS[levelIdx].scripted && !win };
  if (win){
    SFX.win();
    if (levelIdx+1>=unlocked) unlocked=Math.min(LEVELS.length, levelIdx+2);
    rewards = {gold:Math.round((150+40*levelIdx)*SAVE.teamLevel), cr:15+3*levelIdx, sh:8+2*levelIdx, run:6};
    SAVE.gold += rewards.gold; SAVE.shards += rewards.sh; persist();
  } else SFX.lose();
}

// ---------- Логика ----------
function nearest(from,list){ let b=null,bd=1e18; for(const u of list){ if(!u.alive) continue; const d=(u.x-from.x)**2+(u.y-from.y)**2; if(d<bd){bd=d;b=u;} } return b; }
function mostWounded(list){ let b=null,lo=1; for(const u of list){ if(!u.alive)continue; const r=u.hp/u.maxhp; if(r<lo){lo=r;b=u;} } return b; }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

function hurt(t,from,k,isAb){
  const crit = Math.random()<from.crit;
  let d = dmgCalc(from.atk,t.def,k,from.el,t.el,crit);
  if (LEVELS[levelIdx].scripted){
    if (t.team===1) d*=.08; else d*=4.5;
  }
  t.hp-=d; t.hitT=.22;
  t.x += (Math.sign(t.x-from.x)||1)*9;
  fxSparks(t.x, t.y-t.r*.4, (EL[from.el]||EL.fire).c, Math.sign(t.x-from.x)||1);
  if (crit) fxBurst(t.x, t.y-t.r, '#ffffff', false);
  addFloat(t.x,t.y-t.r*2.2,Math.round(d),crit?'#ff9a3d':(t.team===0?'#ff5a5a':'#ffffff'),crit);
  if (crit){ shake(4,.12); freeze(.05); punch=1.045; SFX.crit(t.x); } else SFX.hit(t.x);
  if (t.hp<=0){
    t.hp=0; t.alive=false; t.deathT=.55;
    fxPoof(t.x,t.y-t.r,EL[t.el].c);
    for (let i=0;i<9;i++) effects.push({t:'sp', x:t.x+Math.random()*40-20, y:t.y-t.r,
      vy:-(90+Math.random()*130), life:.9, T:.9, color:EL[t.el].c});
    freeze(.07);
    if (t.boss){
      shake(15,.6); flashT=.3; slowmo(.9); SFX.slam();
      fxBurst(t.x, t.y-t.r*2, '#c07aff', true);
      fxBurst(t.x, t.y-t.r, '#ffffff', true);
    }
  }
}
function strike(u,t){ // момент удара (после замаха)
  u.lungeT=.13; u.followT=.2;
  if (u.range>180 || (u.team===1 && !u.boss && Math.random()<.3)) fxProjectile(u,t,EL[u.el].c,u.team===1);
  else fxSlash(t.x,t.y-t.r*.6, u.boss?'#c07aff':EL[u.el].c);
  SFX.whoosh(t.x);
  hurt(t,u,1,false);
  u.facing = Math.sign(t.x-u.x)||u.facing;
}
function castAbility(u,ab){
  const foes=u.team===0?enemies:team, mates=u.team===0?team:enemies;
  ab.rt=ab.cd;
  u.castT=.5;
  for (let i=0;i<6;i++) effects.push({t:'sp', x:u.x+Math.random()*54-27, y:u.y+Math.random()*40-20,
    vy:-(60+Math.random()*90), life:.6, T:.6, color:EL[u.el].c});
  if (ab.t==='heal'){
    const w=mostWounded(mates)||u;
    w.hp=Math.min(w.maxhp,w.hp+u.atk*ab.k);
    addFloat(w.x,w.y-70,'+'+Math.round(u.atk*ab.k),'#7dff9a');
    fxHeal(w.x,w.y-20); SFX.heal(w.x);
  } else if (ab.t==='buff'){
    for(const m of mates) if(m.alive){ m.hp=Math.min(m.maxhp,m.hp+m.maxhp*ab.k); fxBuff(m); }
    addFloat(u.x,u.y-90,'★ '+ab.n,'#ffd76a'); SFX.heal(u.x);
  } else if (ab.t==='aoe'){
    for(const f of foes) if(f.alive&&dist(f,u)<ab.r+70) hurt(f,u,ab.k,true);
    fxAoe(u.x,u.y,ab.r+60,EL[u.el].c); fxCrack(u.x,u.y+30);
    punch=1.05; addFloat(u.x,u.y-95,ab.n,EL[u.el].c); SFX.cast(u.x);
  } else {
    const t=nearest(u,foes);
    if (t){ fxProjectile(u,t,EL[u.el].c,true); hurt(t,u,ab.k,true); }
    addFloat(u.x,u.y-95,ab.n,EL[u.el].c); SFX.cast(u.x);
  }
}
function moveUnit(u,tx,ty,dt,spdMul){
  const dx=tx-u.x, dy=ty-u.y, d=Math.hypot(dx,dy);
  if (d<14){ u.moving=false; return true; }
  const s=u.spd*(spdMul||1);
  u.x+=dx/d*s*dt; u.y+=dy/d*s*dt;
  if (Math.abs(dx)>6) u.facing=Math.sign(dx);
  u.moving=true;
  return false;
}

function tick(dt){
  battleTime+=dt;
  stepT-=dt;

  // спавн волны
  if (spawnQueue.length){
    for (const q of spawnQueue) q.delay-=dt;
    while (spawnQueue.length && spawnQueue[0].delay<=0) spawnEnemy(spawnQueue.shift());
  }

  // таймеры анимаций
  for (const u of [...team,...enemies]){
    u.hpShow += (u.hp-u.hpShow)*Math.min(1,dt*9);
    if (u.spawnT>0) u.spawnT-=dt;
    if (u.lungeT>0) u.lungeT-=dt;
    if (u.hitT>0) u.hitT-=dt;
    if (!u.alive&&u.deathT>0) u.deathT-=dt;
    if (u.castT>0) u.castT-=dt;
    if (u.followT>0) u.followT-=dt;
    if (u.alive && u.dropY>=0){
      // ПОЗЫ: замах → удар → доводка; канал/релиз каста; 3-кадровый цикл шага
      const has = k => { const im2=IMG[u.artKey+'_'+k]; return im2&&im2.complete&&im2.naturalWidth>0; };
      let np;
      if (u.windup>0) np = has('atk1')? 'atk1' : 'atk';
      else if (u.lungeT>0) np = 'atk';
      else if (u.followT>0) np = has('atk2')? 'atk2' : 'idle';
      else if (u.castT>0) np = (u.castT<.22 && has('cast2'))? 'cast2' : 'cast';
      else if (u.pendingSlam) np = 'cast';
      else if (u.moving || u.team===0){
        const w = [];
        if (has('walk1')) w.push('walk1');
        if (has('walk2')) w.push('walk2');
        if (has('walk3')) w.push('walk3');
        if (!w.length) w.push('idle');
        np = w[Math.floor(Date.now()/125 + u.x*.05) % w.length];
      }
      else np = 'idle';
      // кросс-фейд между позами (плавное перетекание кадров)
      if (np !== u.pose){ u.prevPose = u.pose; u.poseBlend = 0; u.pose = np; }
      else if (u.poseBlend < 1) u.poseBlend = Math.min(1, u.poseBlend + dt/0.085);
      // вспышка релиза заклинания (один раз на каст)
      if (u.castT>0){
        if (u.castT<.2 && !u.castFlash){ u.castFlash=true; fxBurst(u.x, u.y-u.r*1.4, EL[u.el].c, false); }
      } else u.castFlash=false;
      // пыль из-под ног при ходьбе/беге
      u.dustT=(u.dustT||0)-dt;
      if (u.moving && u.dustT<=0){ u.dustT=.18; fxDust(u.x-24*u.facing, u.y+34); }
    }
    if (u.dropY<0){ // босс падает с неба
      u.dropY += 900*dt;
      if (u.dropY>=0){
        u.dropY=0; shake(16,.5); flashT=.15;
        fxAoe(u.x,u.y+40,150,'#c07aff'); SFX.slam();
        bannerText=u.n.toUpperCase()+'!'; bannerT=1.8;
      }
    }
    for (const ab of u.ab||[]) if (ab.rt>0) ab.rt-=dt;
    // шлейф при атаке/беге
    if (u.alive && (u.lungeT>0 || u.moving)){
      u.trail.push({x:u.x,y:u.y,f:u.facing,t:.22});
    }
    for (const g of u.trail) g.t-=dt;
    u.trail = u.trail.filter(g=>g.t>0);
  }

  // === БЕГОВАЯ ДОРОЖКА: мир скроллится, отряд бежит на месте ===
  if (!battleOver){
    const sv = 155;
    camX += sv*dt;
    for (const u of [...team,...enemies]){
      u.x += sv*dt;
      if (u.wp) u.wp.x += sv*dt;
    }
    for (const f of floats) f.x += sv*dt;
    stepT -= dt;
    if (stepT<=0){
      stepT=.16;
      const walker = team.find(h=>h.alive);
      if (walker){ SFX.step(walker.x, Math.floor(Date.now()/160)%2===0); fxDust(walker.x-26*walker.facing, walker.y+34); }
    }
    if (Math.random()<.3) speedLines.push({ x:VW+60, y:100+Math.random()*740,
      len:120+Math.random()*180, v:900+Math.random()*650, a:.10+Math.random()*.16 });
  }
  for (const sl of speedLines) sl.x -= sl.v*dt;
  speedLines = speedLines.filter(sl => sl.x+sl.len > -20);
  if (interWaveT > 0){
    interWaveT -= dt;
    if (interWaveT <= 0 && waveIdx+1 < LEVELS[levelIdx].waves.length){ waveIdx++; beginWave(); }
  }

  // === ФАЗА: бой ===
  else if (!battleOver){
    // завершение замахов
    for (const u of [...team,...enemies]){
      if (u.windup>0){
        u.windup-=dt;
        if (u.windup<=0){
          // удар: по цели замаха, либо по ближайшей, если та пала
          if (u.pendingT && u.pendingT.alive) strike(u,u.pendingT);
          else { const t2=nearest(u,u.team===0?enemies:team); if(t2) strike(u,t2); }
          u.pendingT=null;
        }
      }
    }
    // герои
    for (const u of team){
      if (!u.alive) continue;
      if (u.wp){
        if (moveUnit(u,u.wp.x,u.wp.y,dt,1)) u.wp=null;
      }
      let t=nearest(u,enemies);
      if (t && t.x-camX > VW-60) t = null;
      if (!t && !u.wp) moveUnit(u, camX + u.homeX, GROUND_BOT-140, dt, 1);
      if (t){
        const dd=dist(u,t);
        if (dd>u.range){
          if (!u.wp||autoMode) moveUnit(u,t.x-u.facing*(u.range*.8),t.y,dt,.65);
        } else {
          u.moving=false; u.facing=Math.sign(t.x-u.x)||u.facing;
          u.atkT-=dt;
          if (u.atkT<=0 && u.windup<=0){
            u.atkT=1/(u.role==='Танк'?.8:1.05);
            u.windup=.13; u.pendingT=t; // замах → удар
          }
        }
        if (autoMode||u.role==='Поддержка'){
          for (const ab of u.ab) if (ab.rt<=0){ castAbility(u,ab); break; }
        }
      }
    }
    // враги
    for (const e of enemies){
      if (!e.alive||e.dropY<0) continue;
      const t=nearest(e,team);
      if (!t) continue;
      if (e.x - camX > VW-60){ e.x -= 320*dt; e.moving = true; }
      const dd=dist(e,t);
      // босс: периодический слэм с телеграфом
      if (e.boss){
        e.slamT-=dt;
        if (e.slamT<=0){ e.slamT=6; fxTele(t.x,t.y+30,150); e.pendingSlam={x:t.x,y:t.y,t:.7}; }
        if (e.pendingSlam){
          e.pendingSlam.t-=dt;
          if (e.pendingSlam.t<=0){
            const s=e.pendingSlam; e.pendingSlam=null;
            fxAoe(s.x,s.y+40,170,'#c07aff'); fxCrack(s.x,s.y+40); shake(13,.4); SFX.slam(s.x);
            for (const h of team) if (h.alive&&Math.abs(h.x-s.x)<180&&Math.abs(h.y-s.y)<130) hurt(h,e,1.6,true);
          }
        }
      }
      if (dd>(e.boss?100:78)) moveUnit(e,t.x+(e.boss?90:70)*Math.sign(e.x-t.x||1),t.y,dt,1);
      else {
        e.moving=false; e.facing=Math.sign(t.x-e.x)||e.facing;
        e.atkT-=dt;
        if (e.atkT<=0&&e.windup<=0){ e.atkT=1/.9; e.windup=.15; e.pendingT=t; }
      }
    }
    // волна зачищена → путь дальше или победа
    if (!spawnQueue.length && !enemies.some(e=>e.alive)){
      const lvl=LEVELS[levelIdx];
      if (waveIdx+1<lvl.waves.length){
        interWaveT = 1.35;
        bannerText='ВОЛНА ЗАЧИЩЕНА!'; bannerSub=''; bannerT=1.4;
      } else if (!battleOver){ bannerText='СОН ПРОЙДЕН!'; bannerSub=''; bannerT=2; endBattle(true); }
    }
    if (!team.some(u=>u.alive)) endBattle(false);
  }

  // камера управляется беговой дорожкой (camX += sv*dt выше)
  tickFx(dt);
  for (const f of floats){ f.t+=dt; f.y+=f.vy*dt; f.x+=f.vx*dt; f.vy+=250*dt; }
  floats=floats.filter(f=>f.t<.9);
}

function circle(x,y,r,c,b){ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=c; ctx.fill(); if(b){ctx.lineWidth=5;ctx.strokeStyle=b;ctx.stroke();} }
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,Math.max(0,(n>>16)+amt)),g=Math.min(255,Math.max(0,((n>>8)&255)+amt)),b=Math.min(255,Math.max(0,(n&255)+amt));
  return `rgb(${r},${g},${b})`;
}
function rrect(x,y,w,h,r,f,s){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); if(f){ctx.fillStyle=f;ctx.fill();} if(s){ctx.strokeStyle=s;ctx.lineWidth=3;ctx.stroke();} }

function imgOK(k){ const im=IMG[k]; return im&&im.complete&&im.naturalWidth>0; }

function drawWorld(scx, th){
  if (scx == null) scx = camX;
  if (!th) th = LEVELS[levelIdx].theme || 'dream';
  // НЕБО (параллакс 0.12)
  const sky=IMG.sky;
  if (imgOK('sky')){
    const tile = VW+80;
    let sx = (-scx*.12) % tile;
    if (sx > 0) sx -= tile;
    for (let x = sx; x < VW; x += tile) ctx.drawImage(sky, x, 0, tile, VH);
  } else {
    const g=ctx.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,'#1a2340');g.addColorStop(.5,'#141a2e');g.addColorStop(1,'#0d1224');
    ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  }
  // ВЕКТОРНАЯ ГРА: горы-синусоиды и облака — мир бежит даже без картинок
  if (!imgOK('mid')){
    const hill=(spd, base, amp, col)=>{
      ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,VH);
      for (let x=0;x<=VW;x+=32)
        ctx.lineTo(x, base + Math.sin((x+scx*spd)*0.004)*amp + Math.sin((x+scx*spd)*0.011)*amp*.4);
      ctx.lineTo(VW,VH); ctx.closePath(); ctx.fill();
    };
    hill(.15, 420, 70, 'rgba(52,68,120,0.9)');
    hill(.35, 560, 90, 'rgba(40,52,100,0.95)');
  }
  if (!imgOK('clouds')){
    ctx.globalAlpha=.12; ctx.fillStyle='#9fd0ff';
    for (let i=0;i<3;i++){
      const cy2=260+i*130, cw=VW*.7;
      let ox=(scx*(.3+i*.15)+i*400)%cw; if(ox>0)ox-=cw;
      for (let x=ox;x<VW;x+=cw) ctx.fillRect(x,cy2,cw*.5,18);
    }
    ctx.globalAlpha=1;
  }
  // ДАЛЬНЯЯ ПОЛОСА (параллакс 0.18, темнее/мельче — глубина)
  const mid=IMG['far_'+th] || IMG.mid;
  if (imgOK('mid')){
    const mw2=VW*1.05, st2=mw2;
    let off2=(scx*.18 + Date.now()/9000) % st2;
    if (off2>0) off2-=st2;
    ctx.globalAlpha=.45;
    for (let x=off2; x<VW; x+=st2) ctx.drawImage(mid,x,110,mw2,VH*.42);
    ctx.globalAlpha=1;
  }
  // ПАНОРАМА ТЕМЫ (параллакс 0.4)
  const panorama = IMG['bg_'+th];
  if (panorama && panorama.complete && panorama.naturalWidth>0){
    const mw=VW*1.25, mx=-((scx*.4)%(mw*.85));
    for (let x=mx-mw; x<VW+mw; x+=mw*.85) ctx.drawImage(panorama,x,90,mw,VH*.62);
  } else if (imgOK('mid')){
    const mw=VW*1.4, mx=-((scx*.4)%(mw*.8));
    for (let x=mx-mw; x<VW+mw; x+=mw*.8) ctx.drawImage(mid,x,60,mw,VH*.55);
  }
  // ОБЛАКА-ДРЕЙФ (параллакс 0.6 + собственное движение — фон живёт всегда)
  const cl=IMG.clouds;
  if (cl && cl.complete && cl.naturalWidth>0){
    const cw=VW*.85;
    let off=(scx*.6 + Date.now()/45) % cw;
    if (off>0) off-=cw;
    ctx.globalAlpha=.75;
    const ch=cw*cl.naturalHeight/cl.naturalWidth;
    for (let x=off; x<VW; x+=cw){
      ctx.drawImage(cl,x,VH*.30,cw,ch);
      ctx.globalAlpha=.4;
      ctx.drawImage(cl,x+cw*.4,VH*.52,cw*.9,ch*.9);
      ctx.globalAlpha=.75;
    }
    ctx.globalAlpha=1;
  }
  // ПОЛ ТЕМЫ (параллакс 1.0, БЕСКОНЕЧНЫЙ тайл с чередованием зеркала)
  const front=IMG['ground_'+th] || IMG.front;
  if (imgOK('front')){
    const ftw=1650, fh=GROUND_BOT-GROUND_TOP+120;
    const first=Math.floor((scx-VW)/ftw)*ftw;
    let idx=0;
    for (let x=first; x<scx+VW+ftw; x+=ftw){
      const flip = ((x/ftw)%2+2)%2 >= 1;
      if (flip){
        ctx.save(); ctx.translate(x+ftw,0); ctx.scale(-1,1);
        ctx.drawImage(front,0,GROUND_TOP+40,ftw,fh);
        ctx.restore();
      } else ctx.drawImage(front,x,GROUND_TOP+40,ftw,fh);
      idx++;
    }
  } else {
    ctx.fillStyle='#1c2440';
    ctx.fillRect(0,GROUND_TOP,VW,GROUND_BOT-GROUND_TOP);
    ctx.fillStyle='rgba(120,150,255,0.15)';
    let toff = scx % 240; if (toff>0) toff-=240;
    for (let x=toff;x<VW;x+=240) ctx.fillRect(x+8, GROUND_TOP+14, 224, GROUND_BOT-GROUND_TOP-28);
    ctx.strokeStyle='rgba(120,150,255,0.25)'; ctx.lineWidth=2;
    ctx.strokeRect(0,GROUND_TOP,VW,GROUND_BOT-GROUND_TOP);
  }
  // БЕГУЩИЕ МЕТКИ ПОЛА — пролетающие штрихи создают ощущение скорости
  ctx.save();
  ctx.globalAlpha=.10;
  ctx.fillStyle='#9fd0ff';
  const mk0 = Math.floor((scx-420)/210)*210;
  for (let mx0=mk0; mx0<scx+VW+420; mx0+=210){
    const my=GROUND_TOP+90+((mx0*7919)% (GROUND_BOT-GROUND_TOP-180));
    const w2=26+((mx0*31)%34);
    ctx.beginPath(); ctx.ellipse(mx0,my,w2,5,0,0,7); ctx.fill();
  }
  ctx.restore();
  // руны на полу
  ctx.save();
  ctx.globalAlpha=.09+.05*Math.sin(Date.now()/500);
  ctx.strokeStyle='#7fb2ff'; ctx.lineWidth=3;
  for (let i=0;i<LEVELS[levelIdx].waves.length;i++){
    const cx=roomX(i)+ROOM_W/2, cy=(GROUND_TOP+GROUND_BOT)/2+40, rt=Date.now()/1000+i;
    for (let j=0;j<2;j++){
      ctx.beginPath();
      ctx.ellipse(cx,cy,240+j*54,92+j*22,rt*.18,0,7);
      ctx.stroke();
    }
  }
  ctx.restore();
}
function drawNear(scx, th){
  // ПЕРЕДНИЙ ПЛАН: пропсы с толстыми контурами пролетают ПЕРЕД отрядом — эффект объёма
  if (scx == null) scx = camX;
  if (!th) th = LEVELS[levelIdx].theme || 'dream';
  const im = IMG['near_'+th];
  if (!(im && im.complete && im.naturalWidth > 0)) return;
  const nw = VW*.95, nh = nw*im.naturalHeight/im.naturalWidth;
  let off = (scx*1.35) % nw;
  if (off > 0) off -= nw;
  ctx.globalAlpha = .88;
  for (let x = off; x < VW; x += nw) ctx.drawImage(im, x, VH-nh-70, nw, nh);
  ctx.globalAlpha = 1;
}
function drawUnit(u){
  if (!u.alive&&u.deathT<=0) return;
  const alive=u.alive, deathK=alive?1:Math.max(0,u.deathT/.55);
  const spawnK=u.spawnT>0?u.spawnT/.35:0;
  const wind=u.windup>0?Math.sin(Math.PI*u.windup/.13):0;      // замах: отклонение назад
  const lunge=u.lungeT>0?Math.sin(Math.PI*(1-u.lungeT/.13)):0; // выпад вперёд
  const bob=u.moving?Math.abs(Math.sin(Date.now()/95+u.x)) * -8 : (u.pose==='cast'? Math.sin(Date.now()/220)*-7 : Math.sin(Date.now()/520+u.x)*2.5);
  const breath=1+.015*Math.sin(Date.now()/420+u.x);
  let im = IMG[u.artKey+'_'+(u.pose||'idle')];
  if (!(im&&im.complete&&im.naturalWidth>0)) im = IMG[u.artKey];
  const ok=!!im&&im.complete&&im.naturalWidth>0;
  let pim = (u.poseBlend<1 && u.prevPose)? IMG[u.artKey+'_'+u.prevPose] : null;
  if (pim && !(pim.complete&&pim.naturalWidth>0)) pim = null;
  const footY=u.y+u.r*.8+(u.dropY||0);
  const scale=(1+spawnK*.55)*(1);
  const hgt=u.r*(u.boss?6.1:4.5)*scale;
  const wdt=ok?hgt*im.naturalWidth/im.naturalHeight:0;
  const leanX=(-wind*14+lunge*26)*u.facing;

  // шлейф-послесвечения
  if (ok) for (const g of u.trail){
    const a=g.t/.22*.28;
    ctx.globalAlpha=a;
    const gh=u.r*4.5, gw=gh*im.naturalWidth/im.naturalHeight;
    ctx.save(); ctx.translate(g.x,g.y+u.r*.8); if (g.f<0) ctx.scale(-1,1);
    ctx.drawImage(im,-gw/2,-gh,gw,gh);
    ctx.restore();
  }
  ctx.globalAlpha=alive?1:deathK;

  // тень
  ctx.globalAlpha=(u.dropY<0?.2:.35)*deathK;
  ctx.beginPath(); ctx.ellipse(u.x,u.y+u.r*.8,u.r*1.05*scale*(1+(u.dropY<0?.5:0)),u.r*.3,0,0,7);
  ctx.fillStyle='#000'; ctx.fill();
  // свечение стихии при заклинании
  if (alive && u.pose==='cast' && u.castT>0){
    const rg2=ctx.createRadialGradient(u.x,u.y+u.r*.8,0,u.x,u.y+u.r*.8,u.r*2.4);
    rg2.addColorStop(0,EL[u.el].c);
    rg2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=.4*(u.castT/.5);
    ctx.fillStyle=rg2;
    ctx.beginPath(); ctx.ellipse(u.x,u.y+u.r*.8,u.r*2.4,u.r*.95,0,0,7); ctx.fill();
  }
  ctx.globalAlpha=alive?1:deathK;

  if (ok){
    ctx.save();
    ctx.translate(u.x+leanX, footY+bob+(alive?0:(1-deathK)*16));
    const artDir=u.team===0?1:-1;
    if (u.facing!==artDir) ctx.scale(-1,1);
    if (!alive) ctx.rotate((1-deathK)*.9*-artDir);
    ctx.rotate(u.moving?u.facing*.05:0);           // наклон при беге
    ctx.scale(1,breath);
    if (u.windup>0) ctx.scale(.94,1.02);           // сжатие при замахе
    if (pim){
      ctx.globalAlpha *= (1-u.poseBlend);
      const pw = hgt*pim.naturalWidth/pim.naturalHeight;
      ctx.drawImage(pim,-pw/2,-hgt,pw,hgt);
      ctx.globalAlpha = alive?1:deathK;
    }
    if (u.hitT>0){ try{ctx.filter='brightness('+(1+2.6*(u.hitT/.22))+')';}catch(e){} }
    ctx.drawImage(im,-wdt/2,-hgt,wdt,hgt);
    try{ctx.filter='none';}catch(e){}
    ctx.restore();
  } else {
    // ВЕКТОРНЫЙ ПЕРСОНАЖ: тело+голова+анимированные ноги — виден всегда
    const c=EL[u.el].c;
    const bx=u.x+leanX, by=u.y+bob;
    const step=(u.moving || u.team===0)? Math.sin(Date.now()/95+u.x)*12 : 0;
    ctx.strokeStyle='#dfe3f0'; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(bx-9,by+10); ctx.lineTo(bx-9+step,by+u.r*.95);
    ctx.moveTo(bx+9,by+10); ctx.lineTo(bx+9-step,by+u.r*.95);
    ctx.stroke();
    ctx.beginPath(); ctx.ellipse(bx,by-4,u.r*.72*scale,u.r*.88*scale,0,0,7);
    ctx.fillStyle=u.team===1?shade(c,-45):c;
    ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=shade(c,-90); ctx.stroke();
    circle(bx,by-u.r*.85*scale,u.r*.5*scale,shade(c,60),'#dfe3f0');
    ctx.fillStyle='#1a1a2a';
    ctx.fillRect(bx+u.facing*7*scale-3,by-u.r*.9*scale,6,7);
    if (u.boss){
      ctx.strokeStyle='#f5c542'; ctx.lineWidth=5;
      ctx.beginPath();
      ctx.moveTo(bx-u.r*.4,by-u.r*1.2); ctx.lineTo(bx-u.r*.55,by-u.r*1.55);
      ctx.moveTo(bx+u.r*.4,by-u.r*1.2); ctx.lineTo(bx+u.r*.55,by-u.r*1.55);
      ctx.stroke();
    }
  }
  ctx.globalAlpha=1;

  if (alive&&u.dropY>=0){
    const bw=u.boss?190:96, barY=footY-hgt-(u.boss?20:14)+bob;
    ctx.fillStyle='#000a'; ctx.fillRect(u.x-bw/2,barY,bw,11);
    ctx.fillStyle=u.team===0?'#6dff8a':'#ff6a5a';
    ctx.fillRect(u.x-bw/2,barY,bw*Math.max(0,u.hpShow/u.maxhp),11);
    ctx.font='600 20px Segoe UI'; ctx.textAlign='center';
    ctx.fillStyle=u.boss?'#f5c542':'#dfe3f0';
    ctx.fillText(u.name,u.x,footY+32);
  }
}
function drawFloats(){
  for (const f of floats){
    const k=1-Math.max(0,f.t/.9);
    const pop=1+.7*Math.max(0,1-f.t*7);          // «пружинка» цифр
    ctx.globalAlpha=k;
    ctx.font=`800 ${Math.round((f.big?46:32)*pop)}px Segoe UI`;
    ctx.textAlign='center'; ctx.fillStyle=f.color;
    ctx.strokeStyle='#000a'; ctx.lineWidth=5;
    ctx.strokeText(f.txt,f.x,f.y); ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}

function drawBattle(){
  ctx.save();
  // зум-панч камеры
  ctx.translate(VW/2,VH/2); ctx.scale(punch,punch); ctx.translate(-VW/2,-VH/2);
  if (shakeT>0&&shakeMag>0) ctx.translate((Math.random()*2-1)*shakeMag,(Math.random()*2-1)*shakeMag);
  ctx.save();
  ctx.translate(-camX,0);
  drawWorld();
  for (const e of enemies) drawUnit(e);
  for (const u of team) drawUnit(u);
  drawFx();
  drawFloats();
  const selH = team[sel];
  if (selH && selH.alive && !battleOver){
    const pu = .5+.4*Math.sin(Date.now()/200);
    ctx.globalAlpha = pu;
    ctx.strokeStyle = '#7dff9a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(selH.x, selH.y+selH.r*.8, selH.r*1.25, selH.r*.42, 0, 0, 7); ctx.stroke();
    ctx.globalAlpha = 1;
    const ay = selH.y - selH.r*5.6 + Math.sin(Date.now()/260)*5;
    ctx.fillStyle = '#7dff9a';
    ctx.beginPath(); ctx.moveTo(selH.x-11,ay); ctx.lineTo(selH.x+11,ay); ctx.lineTo(selH.x,ay+15); ctx.closePath(); ctx.fill();
  }
  drawBanner();
  // маркер и тап
  const selU=team[sel];
  if (selU&&selU.alive&&selU.wp){
    ctx.globalAlpha=.5+.3*Math.sin(Date.now()/180);
    ctx.strokeStyle='#7dff9a'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.ellipse(selU.wp.x,selU.wp.y,26,10,0,0,7); ctx.stroke();
    ctx.globalAlpha=1;
  }
  if (ripple){
    const k=ripple.t/.5;
    ctx.globalAlpha=1-k; ctx.strokeStyle='#cfe0ff'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(ripple.x,ripple.y,12+k*36,0,7); ctx.stroke();
    ctx.globalAlpha=1;
  }
  ctx.restore();
  drawAmbient();
  // линии скорости забега
  for (const sl of speedLines){
    ctx.globalAlpha = sl.a;
    const g2 = ctx.createLinearGradient(sl.x,0,sl.x+sl.len,0);
    g2.addColorStop(0,'rgba(180,210,255,0)');
    g2.addColorStop(1,'rgba(220,235,255,0.9)');
    ctx.fillStyle = g2;
    ctx.fillRect(sl.x, sl.y, sl.len, 2.5);
  }
  ctx.globalAlpha = 1;
  drawNear();
  drawRays();
  drawPetals();
  // туман-слои (светящиеся пятна поверх мира)
  ctx.globalCompositeOperation='screen';
  for (let i=0;i<3;i++){
    const t=Date.now()/6000+i*2.2;
    const fx=VW*.5+Math.cos(t)*VW*.3, fy=VH*.45+Math.sin(t*1.4)*140;
    const rg=ctx.createRadialGradient(fx,fy,0,fx,fy,340);
    rg.addColorStop(0,'rgba(77,140,242,0.10)'); rg.addColorStop(1,'rgba(77,140,242,0)');
    ctx.fillStyle=rg; ctx.fillRect(0,0,VW,VH);
  }
  ctx.globalCompositeOperation='source-over';
  ctx.restore();
  // низкое ХП
  if (team.some(u=>u.alive&&u.hp/u.maxhp<.3)){
    const a=.10+.07*Math.sin(lowHpPulse*5);
    const rg=ctx.createRadialGradient(VW/2,VH/2,VH*.35,VW/2,VH/2,VW*.62);
    rg.addColorStop(0,'rgba(255,40,40,0)'); rg.addColorStop(1,'rgba(255,40,40,'+a+')');
    ctx.fillStyle=rg; ctx.fillRect(0,0,VW,VH);
  }
  if (flashT>0){ ctx.fillStyle='rgba(255,255,255,'+(flashT/.22*.5)+')'; ctx.fillRect(0,0,VW,VH); }
  drawBattleHUD();
  drawResult();
}

function hit(p,b){ return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h; }
function onDown(e){
  const p=pt(e); audio();
  if (scene==='menu'){
    for (const b of menuBtns) if (hit(p,b)){
      SFX.click();
      if (b.act==='lvl'){ startBattle(b.i); return; }
      if (b.act==='lvlup'){
        const cost = 150*SAVE.teamLevel;
        if (SAVE.gold >= cost){
          SAVE.gold -= cost; SAVE.teamLevel++;
          persist(); SFX.win();
          menuMsg = 'Отряд силён как никогда! Уровень '+SAVE.teamLevel; menuMsgT = 3;
        } else { menuMsg = 'Не хватает золота — побеждайте в снах!'; menuMsgT = 2.5; }
        return;
      }
      if (b.act==='summon'){
        if (SAVE.heroes.includes('hades')){ menuMsg='Аид уже с вами'; menuMsgT=2; return; }
        if (SAVE.shards >= 80){
          SAVE.shards -= 80; SAVE.heroes.push('hades');
          persist(); SFX.win();
          menuMsg = '★ АИД ПРИСОЕДИНИЛСЯ К ОТРЯДУ ★'; menuMsgT = 4;
        } else { menuMsg = 'Соберите 80 осколков в боях'; menuMsgT = 2.5; }
        return;
      }
      if (b.act==='mvol'){
        AudioState.music = AudioState.music>0? 0 : AudioState.music<.4? .55 : .9;
        if (AudioState.music===.9) AudioState.music=0;
        AudioState.music = AudioState.music===0? .55 : AudioState.music; // цикл 55→90→0
        Music.setMusicVol(AudioState.music); persist(); return;
      }
      if (b.act==='svol'){
        AudioState.sfx = AudioState.sfx>.7? 0 : AudioState.sfx<.3? .5 : .9;
        if (AudioState.sfx===0) AudioState.sfx=.5;
        AudioState.sfx = AudioState.sfx===.5? .5 : AudioState.sfx;
        AudioState.sfx = AudioState.sfx>.9? .9 : AudioState.sfx; // цикл 90→50→0
        if (AudioState.sfx===0){} else {}
        Music.setSfxVol(AudioState.sfx); persist(); return;
      }
      return;
    }
    return;
  }
  if (scene==='battle'){
    for (const b of hudBtns) if (hit(p,b)){
      SFX.click();
      if (b.act==='sel') sel=b.i;
      else if (b.act==='ab'){ const h=team[sel],ab=h.ab[b.i]; if(ab.rt<=0&&h.alive) castAbility(h,ab); }
      else if (b.act==='auto') autoMode=!autoMode;
      else if (b.act==='x2'){ speed2=!speed2; timeScale=speed2?2:1; }
      else if (b.act==='retry') startBattle(levelIdx);
      else if (b.act==='menu') scene='menu';
      return;
    }
    if (!battleOver&&phase==='fight'){
      const wx=p.x+camX;
      if (wx>camX+40&&wx<camX+VW-40&&p.y>GROUND_TOP&&p.y<GROUND_BOT){
        team[sel].wp={x:wx,y:p.y};
        ripple={x:wx,y:p.y,t:0};
      }
    }
  }
}
var dmStartT = Date.now();
cv.addEventListener('pointerdown', function(e){
  const pp = pt(e);
  if (pp.x < 90 && pp.y < 260) { dmDebug = !dmDebug; return; }
});
cv.addEventListener('pointerdown',onDown);
// если rAF не тикает (экзотические браузеры) — включаем резервный таймер
setTimeout(function(){
  if (dmRaf < 20){
    dmNoRaf = true;
    setInterval(function(){ loopInner(Date.now()); }, 33);
  }
}, 1500);

// ---------- Цикл ----------
let last=performance.now();
function loop(now){
  try{
  loopInner(now);
  } catch(err){
    // ошибка кадра — показываем, но НЕ останавливаем игру
    var d=document.getElementById('dm_err');
    if(!d){ d=document.createElement('div'); d.id='dm_err';
      d.style.cssText='position:fixed;left:0;bottom:0;right:0;background:#b00;color:#fff;font:14px monospace;padding:8px;z-index:999;white-space:pre-wrap;';
      (document.body||document.documentElement).appendChild(d); }
    dmReportError('КАДР: '+err, err && err.stack ? err.stack : '');
  }
}
function loopInner(now){
  dmRaf++;
  let dtRaw=Math.min(.05,(now-last)/1000);
  last=now;
  updateAmbient(dtRaw);
  let dt=dtRaw*timeScale;
  if (freezeT>0){ freezeT-=dtRaw; dt=0; }        // стоп-кадр
  if (slowT>0){ slowT-=dtRaw; dt*=.35; }         // слоу-мо
  if (scene==='battle'&&!battleOver) tick(dt||0.0001);
  else if (scene==='battle') tickFx(dt||0.0001);
  if (scene==='menu') drawMenu(); else drawBattle();
  dmLastDraw = Date.now();
  // === ВОДЯНОЙ ЗНАК СБОРКИ: версия + живые часы (видно с первой секунды) ===
  ctx.save();
  ctx.font='800 26px Segoe UI'; ctx.textAlign='center';
  ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,0.75)';
  const wm = 'СБОРКА '+GAME_VERSION+' • '+new Date().toLocaleTimeString();
  ctx.strokeText(wm, VW/2, 30);
  ctx.fillStyle='#ffd76a'; ctx.fillText(wm, VW/2, 30);
  // === ПАНЕЛЬ САМОДИАГНОСТИКИ (первые 8 секунд или тап по левому верхнему углу) ===
  if (dmDebug || Date.now()-dmStartT < 8000){
    ctx.globalAlpha=.92;
    ctx.fillStyle='rgba(5,8,18,0.9)';
    ctx.fillRect(14, 44, 640, 210);
    ctx.strokeStyle='#4d8cf2'; ctx.lineWidth=2;
    ctx.strokeRect(14, 44, 640, 210);
    ctx.globalAlpha=1;
    ctx.textAlign='left'; ctx.font='600 19px Segoe UI';
    const ac = artCount();
    const frozen = dmLastDraw && (Date.now()-dmLastDraw) > 900;
    const lines = [
      ['СБОРКА', GAME_VERSION+' (если тут не v12 — файл старый, скачайте заново!)'],
      ['БРАУЗЕР', (navigator.userAgent||'').slice(0,52)],
      ['ЭКРАН', innerWidth+'x'+innerHeight+' | холст 1920x1080'],
      ['КАДРЫ rAF', dmRaf+' '+(dmNoRaf? '(резервный таймер!)':'')],
      ['КАРТИНКИ', ac[0]+'/'+ac[1]+' | режим: '+(VEC?'ВЕКТОР':'СПРАЙТЫ')],
      ['ЧАСЫ', frozen? 'ЗАМОРОЖЕНЫ — браузер не тянет анимацию, откройте в Chrome/Firefox' : 'живые ✓'],
    ];
    lines.forEach(function(L,i){
      ctx.fillStyle='#7fb2ff'; ctx.fillText(L[0], 30, 76+i*30);
      ctx.fillStyle= L[0]==='ЧАСЫ'&&frozen ? '#ff6a5a' : '#dfe3f0';
      ctx.fillText(L[1], 150, 76+i*30);
    });
    ctx.fillStyle='#667'; ctx.font='500 16px Segoe UI';
    ctx.fillText('тап по левому верхнему углу — скрыть/показать панель', 30, 246);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
